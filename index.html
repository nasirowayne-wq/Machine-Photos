<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SUDHIR PRO MOBILE</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --accent: #ff5d3b;
            --accent-2: #ffb703;
            --accent-soft: #ffb703;
            --accent-dim: #fff0e8;
            --bg: #f4f1ea;
            --bg-2: #f4f1ea;
            --card: #ffffff;
            --card-hover: #fff8f5;
            --ink: #16171b;
            --border: rgba(22, 23, 27, 0.09);
            --border-strong: rgba(255, 93, 59, 0.35);
            --text-dim: #75767e;
            --text-dimmer: #9a9ba2;
            --glass: rgba(244, 241, 234, 0.86);
            --shadow-hard: rgba(22, 23, 27, 0.14);
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-top: env(safe-area-inset-top);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Manrope', sans-serif; }
        h1, h2, h3, .logo, .group-title, .tray-txt, button { font-family: 'Space Grotesk', sans-serif; }

        body {
            background: var(--bg);
            color: var(--ink);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(circle at 12% -5%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 42%),
                radial-gradient(circle at 105% 15%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 38%);
        }

        header {
            padding: calc(var(--safe-top) + 16px) 20px 14px;
            border-bottom: 1.5px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        header::after { content: ''; position: absolute; bottom: -1.5px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent); }
        .logo-block { display: flex; flex-direction: column; gap: 2px; }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 21px;
            letter-spacing: 0.5px;
            color: var(--ink);
        }
        .logo span {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stats-line {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .stats-line b { color: var(--accent); font-weight: 800; }

        main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-bottom) + 30px); }

        .search-container { padding: 16px 15px 8px 15px; }
        .quick-tools-row { display: flex; gap: 8px; margin-top: 10px; }
        .quick-tool-btn {
            flex: 1;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 11px;
            padding: 9px 8px;
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(22,23,27,0.04);
            transition: all 0.15s ease;
        }
        .quick-tool-btn i { width: 14px; height: 14px; }
        .quick-tool-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
        .quick-tool-btn:active { transform: scale(0.97); }
        .search-bar-wrap { position: relative; }
        .search-bar-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-dimmer); width: 16px; height: 16px;
        }
        .search-bar {
            width: 100%;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 14px 14px 40px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 10px rgba(22,23,27,0.04);
            transition: border-color 0.2s, background 0.2s;
        }
        .search-bar:focus { border-color: var(--accent); }
        .search-bar::placeholder { color: var(--text-dim); font-weight: 500; }

        /* Breadcrumb trail */
        .breadcrumb-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 15px 12px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .breadcrumb-wrap::-webkit-scrollbar { display: none; }
        .crumb {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        .crumb:hover { background: rgba(22,23,27,0.05); color: var(--ink); }
        .crumb.active { color: var(--accent); background: var(--accent-dim); }
        .crumb-sep { color: var(--text-dimmer); font-size: 11px; flex-shrink: 0; }

        .nav-controls {
            display: flex;
            gap: 10px;
            padding: 0 15px 12px;
        }
        .nav-btn {
            flex: 1;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 13px;
            padding: 12px;
            color: var(--ink);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(22,23,27,0.05);
            transition: transform 0.15s ease, border-color 0.2s;
        }
        .nav-btn:active { transform: scale(0.97); background: var(--card-hover); }
        .nav-btn:hover { border-color: var(--border-strong); }
        .nav-btn i { color: var(--accent); width: 16px; height: 16px; }

        .action-toggle-container { padding: 0 15px 15px; }
        .multi-select-btn {
            width: 100%;
            background: var(--card);
            border: 1.5px solid var(--border);
            padding: 12px;
            border-radius: 14px;
            color: var(--ink);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 3px 14px rgba(22,23,27,0.05);
            transition: all 0.2s ease;
        }
        .multi-select-btn span { color: var(--accent); }
        .multi-select-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
        .multi-select-btn.active span { color: #fff; }

        .section-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 4px 15px 10px;
        }

        .grid.folder-view {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 12px !important;
            padding: 0 15px !important;
        }

        .grid.photo-view {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 10px !important;
            padding: 0 15px !important;
        }

        @media (min-width: 768px) {
            .grid.folder-view { grid-template-columns: repeat(4, 1fr) !important; gap: 16px !important; }
            .grid.photo-view { grid-template-columns: repeat(6, 1fr) !important; gap: 14px !important; }
            #main-content { max-width: 900px; margin: 0 auto; width: 100%; }
            .search-container { max-width: 560px; margin: 0 auto; }
            .breadcrumb-wrap { max-width: 900px; margin: 0 auto; }
            .nav-controls { max-width: 420px; margin: 0 auto; }
            .action-toggle-container { max-width: 560px; margin: 0 auto; }
            .selection-tray { left: 50%; right: auto; transform: translateX(-50%); width: calc(100% - 30px); max-width: 860px; }
        }

        @media (min-width: 1200px) {
            .grid.folder-view { grid-template-columns: repeat(5, 1fr) !important; gap: 18px !important; }
            .grid.photo-view { grid-template-columns: repeat(8, 1fr) !important; gap: 16px !important; }
            #main-content, .breadcrumb-wrap { max-width: 1180px; }
            .search-container, .nav-controls, .action-toggle-container { max-width: 680px; }
            .selection-tray { max-width: 1100px; }
        }

        .card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            transition: transform 0.15s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 3px 14px rgba(22,23,27,0.05);
            animation: fadeIn 0.28s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .card:active { transform: scale(0.96); }
        .card:hover { border-color: var(--border-strong); background: var(--card-hover); box-shadow: 0 8px 20px rgba(22,23,27,0.1); }

        .card-folder {
            padding: 22px 14px 18px !important;
            display: flex;
            flex-direction: column !important;
            align-items: center !important;
            min-height: 132px !important;
            text-align: center;
            gap: 10px;
            border-left: 4px solid var(--accent);
        }
        .folder-icon-badge {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(22,23,27,0.12);
        }
        .folder-icon-badge i { color: #fff; }
        .card-folder .label {
            font-size: 13px !important;
            font-weight: 700 !important;
            line-height: 1.35;
            color: var(--ink);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-folder .sub-count {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .card-file {
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            border-radius: 12px;
        }
        .card-file .label {
            font-size: 9px;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            color: var(--text-dim);
            width: 100%;
            text-align: center;
            margin-top: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .img-box {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 9px;
            overflow: hidden;
            background: var(--accent-dim);
            border: 1.5px solid var(--border);
            position: relative;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .square-checkbox {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 19px;
            height: 19px;
            border-radius: 5px;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            background: rgba(22, 23, 27, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.15s ease;
            box-shadow: 0 2px 6px rgba(22,23,27,0.3);
        }
        body.select-mode-active .card-file .square-checkbox { display: flex; }

        .fav-heart-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(22, 23, 27, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            color: rgba(255,255,255,0.85);
            transition: all 0.15s ease;
        }
        .fav-heart-btn i { width: 12px; height: 12px; }
        .fav-heart-btn.is-fav { color: #ff5d3b; background: rgba(255,255,255,0.9); }
        .fav-heart-btn.is-fav i { fill: #ff5d3b; }
        body.select-mode-active .fav-heart-btn { display: none; }

        body.grid-compact .grid.photo-view { grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; }
        @media (min-width: 768px) {
            body.grid-compact .grid.photo-view { grid-template-columns: repeat(8, 1fr) !important; }
        }
        @media (min-width: 1200px) {
            body.grid-compact .grid.photo-view { grid-template-columns: repeat(10, 1fr) !important; }
        }

        .scroll-top-btn {
            position: fixed;
            right: 18px;
            bottom: calc(var(--safe-bottom) + 20px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(22,23,27,0.16);
            z-index: 2000;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .scroll-top-btn.hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }

        .card.selected { border-color: var(--accent); background: var(--accent-dim); }
        .card.selected .square-checkbox { background: var(--accent); border-color: var(--accent); }
        .card.selected .square-checkbox i { display: block !important; }

        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 60px 20px;
            color: var(--text-dim);
            text-align: center;
        }
        .empty-state i { color: var(--text-dim); }
        .empty-state .t { font-size: 13px; font-weight: 700; color: var(--text-dim); }

        .selection-tray {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 20px);
            left: 15px;
            right: 15px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            border-radius: 20px;
            padding: 14px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 3000;
            box-shadow: 0 14px 34px rgba(22,23,27,0.2);
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fff;
        }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .tray-txt { font-weight: 800; font-size: 13px; text-transform: uppercase; }
        .tray-btn {
            background: var(--ink);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2200;
            display: none;
            flex-direction: column;
            background-image:
                radial-gradient(circle at 12% -5%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 42%),
                radial-gradient(circle at 105% 15%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 38%);
        }
        .overlay-header {
            padding: calc(var(--safe-top) + 10px) 15px 15px;
            border-bottom: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            backdrop-filter: blur(14px);
        }

        .scroll-area { flex: 1; overflow-y: hidden; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        #lb-stage {
            position: relative;
            width: 100%;
            max-height: 65%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        #lb-img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            box-shadow: 0 20px 40px rgba(22,23,27,0.2);
            will-change: transform, opacity;
        }

        .lb-tap-zone { position: absolute; left: 0; right: 0; height: 25%; z-index: 5; }
        .lb-tap-zone.top { top: 0; }
        .lb-tap-zone.bottom { bottom: 0; }

        .lb-arrow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(22,23,27,0.5);
            border: 1.5px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            color: #fff;
            transition: opacity 0.2s;
        }
        .lb-arrow.up { top: 6px; }
        .lb-arrow.down { bottom: 6px; }
        .lb-arrow.hidden { opacity: 0; pointer-events: none; }

        .lb-hint { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; text-align: center; }

        .lb-counter { margin-top: 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-dim); }

        .action-bar { display: flex; gap: 10px; margin-top: 25px; }
        .act-btn {
            background: var(--card);
            border: 1.5px solid var(--border);
            padding: 12px 20px;
            border-radius: 13px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(22,23,27,0.05);
        }
        .act-btn.primary { color: var(--accent); }
        #lb-fav-btn.is-fav { color: var(--accent); }
        #lb-fav-btn.is-fav i { fill: var(--accent); }
    </style>
</head>
<body>
    <header>
        <div class="logo-block">
            <div class="logo">SUDHIR<span>PRO</span></div>
            <div class="stats-line"><b>192</b> Folders &middot; <b>459</b> Photos</div>
        </div>
    </header>

    <main id="main-content">
        <div class="search-container">
            <div class="search-bar-wrap">
                <i data-lucide="search" size="16"></i>
                <input type="text" id="q" class="search-bar" placeholder="SEARCH MACHINE DATA..." oninput="doSearch()">
            </div>
            <div class="quick-tools-row">
                <button id="fav-filter-btn" class="quick-tool-btn" onclick="toggleFavoritesFilter()" title="Show favorites">
                    <i data-lucide="heart" size="15"></i> FAVORITES
                </button>
                <button id="density-btn" class="quick-tool-btn" onclick="toggleGridDensity()" title="Grid density">
                    <i data-lucide="grid-3x3" size="15"></i> COMPACT
                </button>
            </div>
        </div>

        <div class="breadcrumb-wrap" id="breadcrumbs"></div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="goBack()"><i data-lucide="chevron-left"></i> BACK</button>
            <button class="nav-btn" onclick="goHome()"><i data-lucide="home"></i> HOME</button>
        </div>

        <div id="toggle-area" class="action-toggle-container">
            <button id="select-mode-toggle" class="multi-select-btn" onclick="toggleSelectionMode()">
                <i data-lucide="copy-check"></i>
                <div>SELECT MULTIPLE PHOTOS TO <span>SHARE</span></div>
            </button>
        </div>

        <div class="grid" id="gallery"></div>
    </main>

    <button id="scroll-top-btn" class="scroll-top-btn hidden" onclick="scrollGalleryTop()"><i data-lucide="arrow-up" size="18"></i></button>

    <div id="selection-tray" class="selection-tray">
        <div class="tray-txt" id="tray-count">0 Items Selected</div>
        <button class="tray-btn" onclick="shareSelectedImages()">
            <i data-lucide="share-2" size="16"></i>SHARE ALL
        </button>
    </div>

    <div id="lightbox" class="overlay">
        <div class="overlay-header">
            <button class="act-btn" onclick="closeLB()"><i data-lucide="chevron-left"></i></button>
            <div id="lb-title" style="flex:1; font-weight:800; text-align:center; font-size:14px">PHOTO VIEW</div>
            <button class="act-btn" id="lb-fav-btn" onclick="toggleFavoriteActive()"><i data-lucide="heart" size="18"></i></button>
        </div>
        <div class="scroll-area">
            <div id="lb-stage">
                <div class="lb-tap-zone top" onclick="prevImg()"></div>
                <div class="lb-tap-zone bottom" onclick="nextImg()"></div>
                <button id="lb-arrow-up" class="lb-arrow up" onclick="prevImg()"><i data-lucide="chevron-up" size="20"></i></button>
                <img id="lb-img" src="">
                <button id="lb-arrow-down" class="lb-arrow down" onclick="nextImg()"><i data-lucide="chevron-down" size="20"></i></button>
            </div>
            <div class="lb-counter" id="lb-counter">1 / 1</div>
            <div class="lb-hint" id="lb-hint">Swipe up/down to browse &middot; double-tap to zoom</div>
            <div class="action-bar">
                <button class="act-btn primary" id="dl-btn"><i data-lucide="download"></i>SAVE</button>
                <button class="act-btn primary" onclick="shareActiveImg()"><i data-lucide="share-2"></i>SHARE</button>
            </div>
        </div>
    </div>

:"images/Tower Lights/Towe Light - Wacker Neuson/Towe Light - Wacker Neuson - 03.jpeg","type":"file","parent":"images/Tower Lights/Towe Light - Wacker Neuson"},{"name":"Towe Light - Wacker Neuson - 04.jpeg","path":"images/Tower Lights/Towe Light - Wacker Neuson/Towe Light - Wacker Neuson - 04.jpeg","type":"file","parent":"images/Tower Lights/Towe Light - Wacker Neuson"},{"name":"Welding Machine (500XCC) - MILLER","path":"images/Welding Machines/Welding Machine (500XCC) - MILLER","type":"folder","parent":"images/Welding Machines"},{"name":"Welding Machine (RHINO D 500) - ADOR","path":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR","type":"folder","parent":"images/Welding Machines"},{"name":"01_Welding Machine (500XCC) - MILLER.jpeg","path":"images/Welding Machines/Welding Machine (500XCC) - MILLER/01_Welding Machine (500XCC) - MILLER.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (500XCC) - MILLER"},{"name":"02_Welding Machine (500XCC) - MILLER.jpeg","path":"images/Welding Machines/Welding Machine (500XCC) - MILLER/02_Welding Machine (500XCC) - MILLER.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (500XCC) - MILLER"},{"name":"01_Welding Machine (RHINO D 500) - ADOR.jpeg","path":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR/01_Welding Machine (RHINO D 500) - ADOR.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR"},{"name":"02_Welding Machine (RHINO D 500) - ADOR.jpeg","path":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR/02_Welding Machine (RHINO D 500) - ADOR.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR"},{"name":"03_Welding Machine (RHINO D 500) - ADOR.jpeg","path":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR/03_Welding Machine (RHINO D 500) - ADOR.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR"},{"name":"04_Welding Machine (RHINO D 500) - ADOR.jpeg","path":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR/04_Welding Machine (RHINO D 500) - ADOR.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR"},{"name":"05_Welding Machine (RHINO D 500) - ADOR.jpeg","path":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR/05_Welding Machine (RHINO D 500) - ADOR.jpeg","type":"file","parent":"images/Welding Machines/Welding Machine (RHINO D 500) - ADOR"}];
        let currentPath = "images";
        let selectedFiles = new Set();
        let isSelectionMode = false;
        let isLightboxOpen = false;
        let isFavoritesMode = false;
        let isGridCompact = false;
        let isZoomed = false;

        let currentGalleryItems = [];
        let currentIndex = -1;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchDeltaY = 0;
        let isSwiping = false;
        let isAnimatingSlide = false;
        let lastTapTime = 0;

        // ---- Favorites (stored locally on this device only) ----
        const FAV_KEY = 'sudhirpro_favorites';
        let favoriteSet = new Set();
        (function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAV_KEY);
                if (raw) favoriteSet = new Set(JSON.parse(raw));
            } catch (e) {}
        })();
        function saveFavorites() {
            try { localStorage.setItem(FAV_KEY, JSON.stringify([...favoriteSet])); } catch (e) {}
        }
        function isFavorite(path) { return favoriteSet.has(path); }
        function toggleFavorite(path) {
            if (favoriteSet.has(path)) favoriteSet.delete(path); else favoriteSet.add(path);
            saveFavorites();
        }
        function toggleFavoritesFilter() {
            isFavoritesMode = !isFavoritesMode;
            document.getElementById('fav-filter-btn').classList.toggle('active', isFavoritesMode);
            if (isFavoritesMode) {
                document.getElementById('q').value = '';
                render(rawData.filter(i => i.type === 'file' && isFavorite(i.path)));
            } else {
                render();
            }
        }
        function toggleFavoriteActive() {
            const item = currentGalleryItems[currentIndex];
            if (!item) return;
            toggleFavorite(item.path);
            document.getElementById('lb-fav-btn').classList.toggle('is-fav', isFavorite(item.path));
        }

        // ---- Grid density (compact = more, smaller thumbnails per row) ----
        function applyGridDensity() {
            document.body.classList.toggle('grid-compact', isGridCompact);
            const btn = document.getElementById('density-btn');
            if (btn) {
                btn.classList.toggle('active', isGridCompact);
                btn.innerHTML = '<i data-lucide="grid-3x3" size="15"></i> ' + (isGridCompact ? 'COMFY' : 'COMPACT');
                if (window.lucide) lucide.createIcons();
            }
        }
        (function loadGridDensity() {
            try { isGridCompact = localStorage.getItem('sudhirpro_grid_density') === 'compact'; } catch (e) {}
        })();
        function toggleGridDensity() {
            isGridCompact = !isGridCompact;
            try { localStorage.setItem('sudhirpro_grid_density', isGridCompact ? 'compact' : 'comfy'); } catch (e) {}
            applyGridDensity();
        }

        // ---- Scroll-to-top ----
        function scrollGalleryTop() {
            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getIcon(name) {
            const n = name.toLowerCase();
            if (n.includes('gen')) return 'zap';
            if (n.includes('lift') || n.includes('man')) return 'arrow-up-circle';
            return 'folder';
        }

        // Recursive count of every photo nested under a given folder path (any depth)
        function countPhotosUnder(folderPath) {
            const prefix = folderPath + '/';
            return rawData.filter(i => i.type === 'file' && i.path.startsWith(prefix)).length;
        }

        function toggleSelectionMode() {
            isSelectionMode = !isSelectionMode;
            const btn = document.getElementById('select-mode-toggle');
            if(isSelectionMode) {
                btn.innerHTML = '<i data-lucide="x"></i> CANCEL MULTI-SELECTION MODE';
                btn.classList.add('active');
                document.body.classList.add('select-mode-active');
            } else {
                btn.innerHTML = '<i data-lucide="copy-check"></i> SELECT MULTIPLE PHOTOS TO <span>SHARE</span>';
                btn.classList.remove('active');
                document.body.classList.remove('select-mode-active');
                clearSelections();
            }
            if(window.lucide) lucide.createIcons();
        }

        function handleCardClick(item, cardItem) {
            if (item.type === 'folder') {
                if(isSelectionMode) return;
                window.location.hash = encodeURIComponent(item.path);
                return;
            }

            if (isSelectionMode) {
                if (selectedFiles.has(item.path)) {
                    selectedFiles.delete(item.path);
                    cardItem.classList.remove('selected');
                } else {
                    selectedFiles.add(item.path);
                    cardItem.classList.add('selected');
                }
                updateTray();
            } else {
                const idx = currentGalleryItems.findIndex(i => i.path === item.path);
                openLB(idx >= 0 ? idx : 0);
            }
        }

        function parseAndRouteLocation() {
            const hashValue = window.location.hash.replace('#', '');

            if (hashValue.endsWith('__lightbox')) {
                isLightboxOpen = true;
                return;
            }

            if (isLightboxOpen && !hashValue.endsWith('__lightbox')) {
                isLightboxOpen = false;
                document.getElementById('lightbox').style.display = 'none';
            }

            const cleanPath = decodeURIComponent(hashValue.replace('__lightbox', ''));
            const resolvedPath = (!cleanPath || cleanPath === "images") ? "images" : cleanPath;

            if (resolvedPath !== currentPath && isFavoritesMode) {
                isFavoritesMode = false;
                const favBtn = document.getElementById('fav-filter-btn');
                if (favBtn) favBtn.classList.remove('active');
            }
            currentPath = resolvedPath;

            renderBreadcrumbs();
            render();
            document.getElementById('main-content').scrollTop = 0;
        }

        window.addEventListener('hashchange', parseAndRouteLocation);

        function renderBreadcrumbs() {
            const wrap = document.getElementById('breadcrumbs');
            wrap.innerHTML = '';
            const parts = currentPath.split('/').filter(Boolean); // e.g. ["images","FolderA","Sub"]

            let acc = '';
            parts.forEach((part, idx) => {
                acc = acc ? (acc + '/' + part) : part;
                const isLast = idx === parts.length - 1;
                const label = idx === 0 ? 'HOME' : part;

                const crumb = document.createElement('div');
                crumb.className = 'crumb' + (isLast ? ' active' : '');
                crumb.innerText = label;
                const target = acc;
                crumb.onclick = () => { window.location.hash = encodeURIComponent(target); };
                wrap.appendChild(crumb);

                if (!isLast) {
                    const sep = document.createElement('div');
                    sep.className = 'crumb-sep';
                    sep.innerText = '/';
                    wrap.appendChild(sep);
                }
            });
        }

        function updateTray() {
            const tray = document.getElementById('selection-tray');
            const countLabel = document.getElementById('tray-count');
            if (selectedFiles.size > 0) {
                countLabel.innerText = selectedFiles.size + " File" + (selectedFiles.size > 1 ? "s" : "") + " Selected";
                tray.style.display = 'flex';
            } else {
                tray.style.display = 'none';
            }
        }

        function clearSelections() {
            selectedFiles.clear();
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            updateTray();
        }

        function render(data = null) {
            const grid = document.getElementById('gallery');
            const toggleArea = document.getElementById('toggle-area');
            grid.innerHTML = "";

            // Items belonging exactly to the current folder level -- nested subfolders
            // stay hidden behind their own folder card until the user taps into them.
            // With no explicit data, fall back to favorites (if that filter is on) or
            // the current folder's own contents.
            let list = data;
            if (!list) {
                list = isFavoritesMode
                    ? rawData.filter(i => i.type === 'file' && isFavorite(i.path))
                    : rawData.filter(i => i.parent === currentPath);
            }

            // Folders first, then files, each alphabetically -- keeps deep trees predictable
            list = [...list].sort((a, b) => {
                if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            });

            currentGalleryItems = list.filter(i => i.type === 'file');

            if (!data && isSelectionMode) { toggleSelectionMode(); }

            const hasFiles = list.some(i => i.type === 'file');
            const hasFolders = list.some(i => i.type === 'folder');

            if (hasFolders) {
                grid.className = "grid folder-view";
                toggleArea.style.display = 'none';
            } else {
                grid.className = "grid photo-view";
                toggleArea.style.display = hasFiles ? 'block' : 'none';
            }

            if (list.length === 0) {
                grid.className = "grid folder-view";
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                const msg = isFavoritesMode ? 'No favorites yet â€” tap the heart on any photo' : 'This folder is empty';
                empty.innerHTML = '<i data-lucide="folder-open" size="34"></i><div class="t">' + msg + '</div>';
                grid.appendChild(empty);
                if(window.lucide) lucide.createIcons();
                return;
            }

            list.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = "card " + (item.type === 'folder' ? 'card-folder' : 'card-file');
                card.style.animationDelay = (Math.min(i, 24) * 18) + 'ms';
                if(selectedFiles.has(item.path)) card.classList.add('selected');

                let innerHtml = '';

                if(item.type === 'folder') {
                    const count = countPhotosUnder(item.path);
                    innerHtml += '<div class="folder-icon-badge"><i data-lucide="' + getIcon(item.name) + '" size="22"></i></div>' +
                                 '<div class="label">' + item.name + '</div>' +
                                 '<div class="sub-count">' + count + (count === 1 ? ' photo' : ' photos') + '</div>';
                } else {
                    innerHtml += '<div class="img-box">' +
                                    '<img src="' + encodeURI(item.path) + '" loading="lazy">' +
                                    '<button class="fav-heart-btn' + (isFavorite(item.path) ? ' is-fav' : '') + '"><i data-lucide="heart" size="12"></i></button>' +
                                    '<div class="square-checkbox">' +
                                        '<i data-lucide="check" size="10" style="color:#000;margin:0;display:none;"></i>' +
                                    '</div>' +
                                 '</div>' +
                                 '<div class="label">' + item.name + '</div>';
                }

                card.innerHTML = innerHtml;

                if (item.type === 'file') {
                    const heartBtn = card.querySelector('.fav-heart-btn');
                    if (heartBtn) {
                        heartBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleFavorite(item.path);
                            heartBtn.classList.toggle('is-fav', isFavorite(item.path));
                            if (isFavoritesMode) render(rawData.filter(f => f.type === 'file' && isFavorite(f.path)));
                        });
                    }
                }

                card.onclick = () => handleCardClick(item, card);
                grid.appendChild(card);
            });
            if(window.lucide) lucide.createIcons();
        }

        function doSearch() {
            const val = document.getElementById('q').value.toLowerCase();
            if (isFavoritesMode && val.length > 0) {
                isFavoritesMode = false;
                document.getElementById('fav-filter-btn').classList.remove('active');
            }
            if(val.length > 1) {
                render(rawData.filter(i => i.name.toLowerCase().includes(val) && i.type === 'file'));
            } else { render(); }
        }

        function resetZoom() {
            const img = document.getElementById('lb-img');
            img.style.transition = 'transform 0.2s ease';
            img.style.transform = 'scale(1)';
            img.style.transformOrigin = 'center center';
            isZoomed = false;
        }

        function toggleZoom(clientX, clientY) {
            const img = document.getElementById('lb-img');
            if (!isZoomed) {
                const rect = img.getBoundingClientRect();
                const originX = ((clientX - rect.left) / rect.width) * 100;
                const originY = ((clientY - rect.top) / rect.height) * 100;
                img.style.transformOrigin = originX + '% ' + originY + '%';
                img.style.transition = 'transform 0.25s ease';
                img.style.transform = 'scale(2.4)';
                isZoomed = true;
            } else {
                resetZoom();
            }
        }

        function updateLBChrome() {
            const item = currentGalleryItems[currentIndex];
            document.getElementById('lb-title').innerText = item.name.toUpperCase();
            document.getElementById('lb-counter').innerText = (currentIndex + 1) + ' / ' + currentGalleryItems.length;
            document.getElementById('lb-arrow-up').classList.toggle('hidden', currentIndex <= 0);
            document.getElementById('lb-arrow-down').classList.toggle('hidden', currentIndex >= currentGalleryItems.length - 1);
            document.getElementById('lb-fav-btn').classList.toggle('is-fav', isFavorite(item.path));
        }

        function openLB(index) {
            if (index < 0 || index >= currentGalleryItems.length) return;
            isLightboxOpen = true;
            currentIndex = index;
            window.location.hash = encodeURIComponent(currentPath) + '__lightbox';

            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lb-img');
            img.style.transition = 'none';
            img.style.transform = 'translateY(0) scale(1)';
            img.style.transformOrigin = 'center center';
            img.style.opacity = '1';
            isZoomed = false;
            img.src = encodeURI(currentGalleryItems[index].path);

            updateLBChrome();
            lb.style.display = 'flex';
            if(window.lucide) lucide.createIcons();
        }

        function slideTo(newIndex, direction) {
            if (isAnimatingSlide || newIndex < 0 || newIndex >= currentGalleryItems.length) return;
            isAnimatingSlide = true;
            if (isZoomed) resetZoom();

            const img = document.getElementById('lb-img');
            // 'next' means content enters from below (like scrolling a feed down);
            // 'prev' means it enters from above.
            const outY = direction === 'next' ? '-60px' : '60px';

            img.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
            img.style.transform = 'translateY(' + outY + ')';
            img.style.opacity = '0';

            setTimeout(() => {
                currentIndex = newIndex;
                img.src = encodeURI(currentGalleryItems[currentIndex].path);
                updateLBChrome();

                const inY = direction === 'next' ? '60px' : '-60px';
                img.style.transition = 'none';
                img.style.transform = 'translateY(' + inY + ')';

                requestAnimationFrame(() => {
                    img.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
                    img.style.transform = 'translateY(0)';
                    img.style.opacity = '1';
                    setTimeout(() => { isAnimatingSlide = false; }, 190);
                });
            }, 180);
        }

        function nextImg() { slideTo(currentIndex + 1, 'next'); }
        function prevImg() { slideTo(currentIndex - 1, 'prev'); }

        function closeLB() {
            if (window.location.hash.includes('__lightbox')) {
                history.back();
            }
        }

        (function setupSwipe() {
            const stage = document.getElementById('lb-stage');
            const img = document.getElementById('lb-img');

            stage.addEventListener('touchstart', (e) => {
                if (isAnimatingSlide) return;
                isSwiping = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchDeltaY = 0;
                if (!isZoomed) img.style.transition = 'none';
            }, { passive: true });

            stage.addEventListener('touchmove', (e) => {
                if (!isSwiping || isAnimatingSlide || isZoomed) return;
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) return; // ignore mostly-horizontal drags
                touchDeltaY = dy;
                img.style.transform = 'translateY(' + dy + 'px)';
                img.style.opacity = String(1 - Math.min(Math.abs(dy) / 400, 0.4));
            }, { passive: true });

            stage.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                isSwiping = false;

                // Double-tap to zoom: two quick taps with no drag toggles zoom in/out.
                const now = Date.now();
                if (Math.abs(touchDeltaY) < 8) {
                    if (now - lastTapTime < 320) {
                        const t = e.changedTouches[0];
                        toggleZoom(t.clientX, t.clientY);
                        lastTapTime = 0;
                        touchDeltaY = 0;
                        return;
                    }
                    lastTapTime = now;
                }

                if (isZoomed) { touchDeltaY = 0; return; }

                img.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                const THRESHOLD = 55;
                if (touchDeltaY <= -THRESHOLD && currentIndex < currentGalleryItems.length - 1) {
                    nextImg();
                } else if (touchDeltaY >= THRESHOLD && currentIndex > 0) {
                    prevImg();
                } else {
                    img.style.transform = 'translateY(0)';
                    img.style.opacity = '1';
                }
                touchDeltaY = 0;
            });
        })();

        document.addEventListener('keydown', (e) => {
            if (!isLightboxOpen) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextImg();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevImg();
            if (e.key === 'Escape') closeLB();
        });

        document.getElementById('dl-btn').addEventListener('click', () => {
            const item = currentGalleryItems[currentIndex];
            if (!item) return;
            const a = document.createElement('a');
            a.href = encodeURI(item.path);
            a.download = item.name;
            a.click();
        });

        async function shareActiveImg() {
            const item = currentGalleryItems[currentIndex];
            if (!item) return;
            try {
                const response = await fetch(encodeURI(item.path));
                const blob = await response.blob();
                const file = new File([blob], item.name, { type: blob.type });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'Sudhir Pro Photo' });
                }
            } catch (err) { console.error(err); }
        }

        async function shareSelectedImages() {
            if(selectedFiles.size === 0) return;
            const filesArray = [];
            try {
                for (let path of selectedFiles) {
                    const response = await fetch(encodeURI(path));
                    const blob = await response.blob();
                    const filename = path.split('/').pop() || 'photo.jpg';
                    const file = new File([blob], filename, { type: blob.type });
                    filesArray.push(file);
                }
                if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                    await navigator.share({
                        files: filesArray,
                        title: 'Sudhir Pro Portfolio Share',
                        text: 'Shared items from machine database portal.'
                    });
                } else {
                    alert("Your browser or device context doesn't support sharing multiple files directly.");
                }
            } catch (err) { console.error("Sharing failed: ", err); }
        }

        function goHome() { window.location.hash = "images"; }

        function goBack() {
            if (isLightboxOpen) {
                closeLB();
                return;
            }
            if (currentPath !== "images") {
                const targetPath = currentPath.split('/').slice(0, -1).join('/') || "images";
                window.location.hash = encodeURIComponent(targetPath);
            }
        }

        applyGridDensity();

        document.getElementById('main-content').addEventListener('scroll', () => {
            const main = document.getElementById('main-content');
            const btn = document.getElementById('scroll-top-btn');
            btn.classList.toggle('hidden', main.scrollTop < 400);
        });

        parseAndRouteLocation();
    </script>
</body>
</html>
